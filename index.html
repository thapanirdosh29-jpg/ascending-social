<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ascending Social</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#0f172a,#1e293b);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            color:white;
        }

        .card{
            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(10px);
            padding:40px;
            border-radius:20px;
            text-align:center;
            width:350px;
            box-shadow:0 8px 25px rgba(0,0,0,0.3);
        }

        .profile-pic{
            width:120px;
            height:120px;
            border-radius:50%;
            object-fit:cover;
            border:3px solid white;
            margin-bottom:15px;
        }

        h1{
            margin-bottom:10px;
        }

        p{
            color:#cbd5e1;
            margin-bottom:20px;
        }

        .link{
            display:block;
            text-decoration:none;
            background:#38bdf8;
            color:white;
            padding:12px;
            margin:10px 0;
            border-radius:10px;
            transition:0.3s;
            font-weight:bold;
        }

        .link:hover{
            background:#0ea5e9;
            transform:translateY(-2px);
        }

        footer{
            margin-top:20px;
            font-size:12px;
            color:#94a3b8;
        }
    </style>
</head>
<body>

    <div class="card">
        profile.jpg

        <h1>Ascending Social</h1>
        <p>Helping businesses grow through social media 🚀</p>

        #Instagram</a>
        #TikTok</a>
        #YouTube</a>
        #Contact Us</a>

        <footer>
            © 2026 Ascending Social
        </footer>
    </div>

</body>
</html>
